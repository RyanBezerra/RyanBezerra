name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📊 Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: RyanBezerra
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          template: classic
          config_timezone: America/Sao_Paulo
          config_order: base.header, isocalendar, base.activity+, base.community, base.repositories, lines, languages, habits, achievements, activity, followup, notable

          base: header, activity, community, repositories, metadata
          base_indepth: yes

          # Calendário de commits (estilo “heatmap animado”)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Linhas adicionadas / removidas
          plugin_lines: yes
          plugin_lines_sections: base, repositories

          # Linguagens
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes, percentage
          plugin_languages_colors: github

          # Atividade recente
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14
          plugin_activity_filter: all

          # Hábitos (horários / dias que mais code)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Conquistas
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 6

          # Follow-up (issues/PRs)
          plugin_followup: yes
          plugin_followup_sections: repositories

          # Contribuições notáveis
          plugin_notable: yes
          plugin_notable_from: organization

          plugins_errors_fatal: no
